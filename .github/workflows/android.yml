name: Build GlycoNour Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Préparer le projet Android
        run: |
          mkdir cap
          cd cap
          mkdir www
          cp ../index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.glyconour.app","appName":"GlycoNour","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Construire l'APK
        working-directory: cap/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: glyconour-android
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
  }
}
